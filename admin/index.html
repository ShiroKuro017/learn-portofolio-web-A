<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShirO Portfolio - Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Explicit Decap CMS Config URL to prevent Vercel 404 relative path error -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <!-- Netlify Identity Widget for Cross-Origin Fallback -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      font-family: 'Inconsolata', monospace !important;
      background-color: #0c0a09;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <!-- Decap CMS Dashboard Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Automatic Client-Side Image Compressor & Indonesia Date Renamer for Decap CMS -->
  <script>
    (function() {
      const MAX_DIMENSION = 2560; // Crisp 2.5K high quality resolution
      const QUALITY = 0.90; // Visually lossless 90% high quality

      function getIndonesiaDateFilename() {
        const hash = window.location.hash || '';
        let prefix = 'art';
        if (hash.includes('2d')) prefix = '2d';
        else if (hash.includes('3d')) prefix = '3d';
        else if (hash.includes('video')) prefix = 'video';
        else if (hash.includes('photo') || hash.includes('pic')) prefix = 'pic';

        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const dateStr = `${dd}-${mm}-${yyyy}`;

        const storageKey = `upload_${prefix}_${dateStr}`;
        let defaultInitial = (prefix === 'pic' && dateStr === '21-09-2026') ? 4 : 0;
        let count = parseInt(localStorage.getItem(storageKey) || defaultInitial.toString(), 10);
        count += 1;
        localStorage.setItem(storageKey, count.toString());

        if (prefix === 'pic') {
          const sequence = String(count).padStart(2, '0');
          return `${prefix}-${dateStr}-${sequence}.jpg`;
        } else if (count === 1) {
          return `${prefix}-${dateStr}.jpg`;
        } else {
          const sequence = String(count - 1).padStart(2, '0');
          return `${prefix}-${dateStr}-${sequence}.jpg`;
        }
      }

      async function processAndCompressImage(file) {
        if (!file.type.startsWith('image/')) {
          return file;
        }

        const newFileName = getIndonesiaDateFilename();

        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              let width = img.width;
              let height = img.height;

              if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, width, height);

              canvas.toBlob((blob) => {
                if (blob) {
                  const finalFile = new File([blob], newFileName, {
                    type: 'image/jpeg',
                    lastModified: Date.now()
                  });
                  console.log(`[AutoProcess] ${file.name} -> ${newFileName} (${(finalFile.size/1024).toFixed(1)}KB)`);
                  resolve(finalFile);
                } else {
                  resolve(new File([file], newFileName, { type: file.type }));
                }
              }, 'image/jpeg', QUALITY);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      // Intercept file input change events in Decap CMS UI
      document.addEventListener('change', async function(e) {
        if (e.target && e.target.type === 'file' && e.target.files && e.target.files.length) {
          const originalFile = e.target.files[0];
          if (originalFile && originalFile.type.startsWith('image/')) {
            const processed = await processAndCompressImage(originalFile);
            if (processed) {
              const dataTransfer = new DataTransfer();
              dataTransfer.items.add(processed);
              e.target.files = dataTransfer.files;
              e.target.dispatchEvent(new Event('input', { bubbles: true }));
            }
          }
        }
      }, true);
    })();
  </script>
</body>
</html>
