<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShirO Portfolio - Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Explicit Decap CMS Config URL to prevent Vercel 404 relative path error -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <!-- Netlify Identity Widget for Cross-Origin Fallback -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      font-family: 'Inconsolata', monospace !important;
      background-color: #0c0a09;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <!-- Decap CMS Dashboard Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Automatic Client-Side Image Compressor & Indonesia Date Renamer for Decap CMS -->
  <script>
    (function() {
      const MAX_DIMENSION = 2560; // Crisp 2.5K high quality resolution
      const QUALITY = 0.90; // Visually lossless 90% high quality

      function getIndonesiaDateFilename() {
        const hash = (window.location.hash || '').toLowerCase();
        let prefix = 'pic';
        if (hash.includes('2d') || hash.includes('art') || hash.includes('gambar')) prefix = 'art';
        else if (hash.includes('3d')) prefix = '3d';
        else if (hash.includes('video')) prefix = 'video';
        else if (hash.includes('photo') || hash.includes('pic')) prefix = 'pic';

        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const dateStr = `${dd}-${mm}-${yyyy}`;

        const storageKey = `upload_${prefix}_${dateStr}`;
        // Prefix pic already has 19 photos for 21-09-2026
        let defaultInitial = (prefix === 'pic' && dateStr === '21-09-2026') ? 19 : 0;
        let count = parseInt(localStorage.getItem(storageKey) || defaultInitial.toString(), 10);
        count += 1;
        localStorage.setItem(storageKey, count.toString());

        if (prefix === 'pic') {
          const sequence = String(count).padStart(2, '0');
          return `${prefix}-${dateStr}-${sequence}.jpg`;
        } else if (count === 1) {
          return `${prefix}-${dateStr}.jpg`;
        } else {
          const sequence = String(count - 1).padStart(2, '0');
          return `${prefix}-${dateStr}-${sequence}.jpg`;
        }
      }

      async function processAndCompressImage(file) {
        if (!file.type.startsWith('image/') || file.type === 'image/svg+xml' || file.type === 'image/gif') {
          return file;
        }

        const newFileName = getIndonesiaDateFilename();

        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              let width = img.width;
              let height = img.height;

              if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, width, height);

              canvas.toBlob((blob) => {
                if (blob) {
                  const finalFile = new File([blob], newFileName, {
                    type: 'image/jpeg',
                    lastModified: Date.now()
                  });
                  console.log(`[AutoProcess] ${file.name} -> ${newFileName} (${(finalFile.size / 1024).toFixed(1)} KB)`);
                  resolve(finalFile);
                } else {
                  resolve(new File([file], newFileName, { type: file.type }));
                }
              }, 'image/jpeg', QUALITY);
            };
            img.onerror = function() {
              resolve(new File([file], newFileName, { type: file.type }));
            };
            img.src = e.target.result;
          };
          reader.onerror = function() {
            resolve(file);
          };
          reader.readAsDataURL(file);
        });
      }

      // Synchronously intercept file input change events before React handles them
      window.addEventListener('change', async function(e) {
        const target = e.target;
        if (!target || target.type !== 'file' || !target.files || !target.files.length) {
          return;
        }

        // If already processed, let React receive the event
        if (target.dataset.processed === 'true') {
          delete target.dataset.processed;
          return;
        }

        const originalFiles = Array.from(target.files);
        const hasImage = originalFiles.some(f => f.type.startsWith('image/'));
        if (!hasImage) {
          return;
        }

        // Stop the raw event synchronously before React captures the original file
        e.stopImmediatePropagation();
        e.stopPropagation();
        e.preventDefault();

        try {
          const dt = new DataTransfer();
          for (const f of originalFiles) {
            const processed = await processAndCompressImage(f);
            dt.items.add(processed);
          }

          target.dataset.processed = 'true';
          target.files = dt.files;

          // Dispatch synthetic event with the processed files
          target.dispatchEvent(new Event('change', { bubbles: true }));
        } catch (err) {
          console.error('Failed to process image:', err);
        }
      }, true); // Use capture phase

      // Intercept drag and drop file uploads
      window.addEventListener('drop', async function(e) {
        if (e._isProcessedDrop) return;
        if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;

        const files = Array.from(e.dataTransfer.files);
        const hasImage = files.some(f => f.type.startsWith('image/'));
        if (!hasImage) return;

        e.stopImmediatePropagation();
        e.stopPropagation();
        e.preventDefault();

        const dropTarget = e.target;
        try {
          const dt = new DataTransfer();
          for (const f of files) {
            const processed = await processAndCompressImage(f);
            dt.items.add(processed);
          }

          const dropEvent = new DragEvent('drop', {
            bubbles: true,
            cancelable: true,
            dataTransfer: dt
          });
          dropEvent._isProcessedDrop = true;
          dropTarget.dispatchEvent(dropEvent);
        } catch (err) {
          console.error('Failed to process dropped image:', err);
        }
      }, true);
    })();
  </script>
</body>
</html>
